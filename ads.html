<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADS</title>
    <style>
        body {
            background-color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Prevents weird horizontal scrolling */
            min-height: 2000px; /* Makes a long page so ads have space to scatter */
        }
        h1 {
            font-size: 80px;
            font-weight: 900;
            letter-spacing: 5px;
            text-align: center;
            margin-top: 50px;
            position: relative;
            z-index: 100; /* Keeps the word ADS layered on top */
            pointer-events: none; /* Stops it from blocking clicks */
        }
        /* This makes the ads break free from rows and columns */
        .crazy-ad {
            position: absolute !important;
            border: 0;
            padding: 0;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3); /* Adds a shadow so they pop out */
        }
    </style>
</head>
<body>

    <!-- Your big bold text -->
    <h1>ADS</h1>

    <!-- 10 Ads that will get randomly scattered by the script below -->
    <iframe class="crazy-ad" data-aa='2451835' src='https://a-ads.com' style='width:300px; height:250px;'></iframe>
    <iframe class="crazy-ad" data-aa='2451835' src='https://a-ads.com' style='width:300px; height:250px;'></iframe>
    <iframe class="crazy-ad" data-aa='2451835' src='https://a-ads.com' style='width:250px; height:250px;'></iframe>
    <iframe class="crazy-ad" data-aa='2451835' src='https://a-ads.com' style='width:336px; height:280px;'></iframe>
    <iframe class="crazy-ad" data-aa='2451835' src='https://a-ads.com' style='width:300px; height:250px;'></iframe>
    <iframe class="crazy-ad" data-aa='2451835' src='https://a-ads.com' style='width:200px; height:200px;'></iframe>
    <iframe class="crazy-ad" data-aa='2451835' src='https://a-ads.com' style='width:300px; height:250px;'></iframe>
    <iframe class="crazy-ad" data-aa='2451835' src='https://a-ads.com' style='width:250px; height:250px;'></iframe>
    <iframe class="crazy-ad" data-aa='2451835' src='https://a-ads.com' style='width:300px; height:250px;'></iframe>
    <iframe class="crazy-ad" data-aa='2451835' src='https://a-ads.com' style='width:336px; height:280px;'></iframe>

    <!-- This magic script instantly breaks the perfect grid and scrambles everything -->
    <script>
        const ads = document.querySelectorAll('.crazy-ad');
        
        ads.forEach(ad => {
            // Generates completely random coordinates on the page
            const randomX = Math.floor(Math.random() * (window.innerWidth - 320));
            const randomY = Math.floor(Math.random() * 1500) + 150; // Scatters them down the page
            
            // Generates a random rotation angle between -15 and 15 degrees
            const randomRotate = Math.floor(Math.random() * 30) - 15;
            
            // Generates a random layout stacking layer
            const randomZIndex = Math.floor(Math.random() * 50);

            // Applies the crazy styles directly to the ad block
            ad.style.left = randomX + 'px';
            ad.style.top = randomY + 'px';
            ad.style.transform = `rotate(${randomRotate}deg)`;
            ad.style.zIndex = randomZIndex;
        });
    </script>

</body>
</html>
